<!doctype html>
<html lang="en" class="anim">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <title>Orbit — Secure system</title>
  <style>
    :root {
      --ink: #ffffff;
      --surface: #161616;
      --orb-reveal: cubic-bezier(.16, 1, .3, 1);
      --orb-soft: cubic-bezier(.25, .8, .28, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--surface);
      color: var(--ink);
      font-family: "Orbit Sans", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    .viewport {
      position: fixed;
      inset: 0;
      background: #000000;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      inset: 0;
      contain: strict;
      isolation: isolate;
      background: var(--surface);
      width: 100%;
      height: 100%;
    }

    /* Brand mark */
    .brand-mark {
      position: absolute;
      top: 2.141745dvh;
      left: 3.854167vw;
      width: clamp(34px, min(3.4375vw, 5.2dvh), 66px);
      height: auto;
      aspect-ratio: 66 / 62;
      z-index: 4;
    }

    .brand-mark svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Primary nav */
    .primary-nav {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      list-style: none;
    }

    .primary-nav li {
      position: absolute;
      top: 3.426791dvh;
    }

    .primary-nav a {
      display: inline-block;
      pointer-events: auto;
      color: #ffffff;
      text-decoration: none;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 25px);
      font-weight: 400;
      transform-origin: left center;
      transition: opacity 0.2s ease;
    }

    .primary-nav a:hover {
      opacity: 0.8;
    }

    .nav-home { left: 10.104167vw; }
    .nav-home a { transform: scaleX(1.165); }

    .nav-resources { left: 17.526042vw; }
    .nav-resources a { transform: scaleX(1.052); }

    .nav-benefits { left: 27.578125vw; }
    .nav-benefits a { transform: scaleX(1.126); }

    .nav-contact { left: 36.171875vw; }
    .nav-contact a { transform: scaleX(1.168); }

    /* Secure system pill */
    .secure-pill {
      position: absolute;
      top: 2.336449dvh;
      right: 7.5vw;
      height: clamp(34px, 4.439252dvh, 57px);
      padding: 0 clamp(18px, 2.2vw, 36px);
      background: #ffffff;
      color: #161616;
      border-radius: 999px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: clamp(13px, min(1.25vw, 1.95dvh), 22px);
      font-weight: 500;
      letter-spacing: 0.026923em;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.22s var(--orb-reveal), background-color 0.2s ease, box-shadow 0.25s ease;
      white-space: nowrap;
      border: none;
      cursor: pointer;
    }

    .secure-pill:hover {
      transform: scale(1.04);
      background: #f0f0f0;
      box-shadow: 0 6px 28px rgba(253, 134, 219, 0.45);
    }

    /* Wordmark ORBIT */
    .orbit-word {
      position: absolute;
      top: 11.565421dvh;
      left: 4.348958vw;
      margin: 0;
      padding: 0;
      z-index: 1;
      font-family: "Orbit Display", "Times New Roman", Times, serif;
      font-size: min(27.8125vw, 55dvh);
      line-height: 0.85;
      letter-spacing: 0.033708em;
      font-weight: 400;
      pointer-events: none;
    }

    .orbit-word__mask {
      display: inline-block;
      overflow: hidden;
      padding-bottom: 0.08em;
      margin-bottom: -0.08em;
    }

    .orbit-word__inner {
      display: inline-flex;
      align-items: baseline;
      will-change: transform;
    }

    .orbit-word__white {
      color: #ffffff;
      display: inline-flex;
      align-items: baseline;
    }

    .orbit-word__o {
      display: inline-block;
      transform: scaleX(1.0866);
      margin-right: 0.042135em;
    }

    .orbit-word__pink {
      background: linear-gradient(180deg, #ffc5dc 0%, #fd86db 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Flower stack */
    .flower {
      position: absolute;
      top: 14.749065dvh;
      left: 49.121328vw;
      height: 106.109034dvh;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .flower__sizer {
      height: 100%;
      width: auto;
      opacity: 0;
      visibility: hidden;
      display: block;
    }

    .flower__layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .flower__layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .flower__layer--top {
      -webkit-mask-image: linear-gradient(#0000, #0000);
      mask-image: linear-gradient(#0000, #0000);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    .flower__layer--bg {
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* Corner copy */
    .support-copy {
      position: absolute;
      bottom: 4.361371dvh;
      color: #f7f7f7;
      font-size: clamp(14px, min(1.40625vw, 2.102804dvh), 27px);
      line-height: 1.35;
      font-weight: 400;
      z-index: 3;
      pointer-events: none;
    }

    .support-copy--left {
      left: 3.177083vw;
    }
    .support-copy--left .support-copy__inner {
      transform: scaleX(1.073);
      transform-origin: left bottom;
    }

    .support-copy--right {
      left: 78.28125vw;
    }
    .support-copy--right .support-copy__inner {
      transform: scaleX(1.058);
      transform-origin: left bottom;
    }

    /* Mobile burger and sheet */
    .mobile-burger {
      display: none;
      position: absolute;
      top: 2.336449dvh;
      right: 5vw;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      cursor: pointer;
      z-index: 12;
      align-items: center;
      justify-content: center;
    }

    .mobile-burger-lines {
      width: 18px;
      height: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mobile-burger-lines span {
      display: block;
      height: 2px;
      width: 100%;
      background-color: #161616;
      border-radius: 1px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .mobile-burger.open .mobile-burger-lines span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }
    .mobile-burger.open .mobile-burger-lines span:nth-child(2) {
      opacity: 0;
    }
    .mobile-burger.open .mobile-burger-lines span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    .mobile-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .mobile-scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-sheet {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(85vw, 360px);
      background: rgba(22, 22, 22, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding: 80px 32px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      transform: translateX(100%);
      transition: transform 0.35s var(--orb-reveal);
    }

    .mobile-sheet.open {
      transform: translateX(0);
    }

    .mobile-nav-links {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .mobile-nav-links a {
      color: #ffffff;
      font-size: 24px;
      text-decoration: none;
      font-weight: 400;
    }

    .mobile-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #ffffff;
      color: #161616;
      border-radius: 999px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    /* Entrance Animation Keyframes */
    @keyframes orb-word {
      0% { transform: translateY(118%); }
      100% { transform: translateY(0%); }
    }

    @keyframes orb-subject {
      0% { opacity: 0; transform: translateX(-50%) translateY(3.4dvh); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes orb-corner {
      0% { opacity: 0; transform: translateY(1.8dvh); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes orb-quiet {
      0% { opacity: 0; transform: translateY(1.2dvh); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes orb-dim {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    html.anim .brand-mark {
      opacity: 0;
      animation: orb-quiet 620ms var(--orb-soft) 100ms forwards;
    }

    html.anim .nav-home a {
      opacity: 0;
      animation: orb-dim 550ms var(--orb-soft) 180ms forwards;
    }

    html.anim .nav-resources a {
      opacity: 0;
      animation: orb-dim 550ms var(--orb-soft) 225ms forwards;
    }

    html.anim .nav-benefits a {
      opacity: 0;
      animation: orb-dim 550ms var(--orb-soft) 270ms forwards;
    }

    html.anim .nav-contact a {
      opacity: 0;
      animation: orb-dim 550ms var(--orb-soft) 315ms forwards;
    }

    html.anim .secure-pill {
      opacity: 0;
      animation: orb-quiet 620ms var(--orb-soft) 340ms forwards;
    }

    html.anim .orbit-word__inner {
      transform: translateY(118%);
      animation: orb-word 1150ms var(--orb-reveal) 300ms forwards;
    }

    html.anim .flower {
      opacity: 0;
      animation: orb-subject 1150ms var(--orb-reveal) 660ms forwards;
    }

    html.anim .support-copy--left {
      opacity: 0;
      animation: orb-corner 720ms var(--orb-soft) 980ms forwards;
    }

    html.anim .support-copy--right {
      opacity: 0;
      animation: orb-corner 720ms var(--orb-soft) 980ms forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      html.anim .brand-mark,
      html.anim .primary-nav a,
      html.anim .secure-pill,
      html.anim .orbit-word__inner,
      html.anim .flower,
      html.anim .support-copy {
        animation: orb-dim 280ms ease forwards !important;
        transform: none !important;
      }
    }

    @media (max-width: 1200px) {
      .orbit-word {
        left: 0;
        width: 100%;
        text-align: center;
      }
    }

    @media (max-width: 900px), (max-aspect-ratio: 4/5) {
      .primary-nav,
      .secure-pill {
        display: none;
      }

      .mobile-burger {
        display: flex;
      }

      .flower {
        height: min(55dvh, 110vw);
        top: 25dvh;
      }

      .orbit-word {
        font-size: min(27.5vw, 18dvh);
        top: 15dvh;
        left: 0;
        width: 100%;
        text-align: center;
      }

      .support-copy--left {
        left: 6vw;
        bottom: 6dvh;
        max-width: 42vw;
      }

      .support-copy--right {
        left: auto;
        right: 6vw;
        bottom: 6dvh;
        max-width: 42vw;
        text-align: right;
      }
      
      .support-copy--right .support-copy__inner {
        transform-origin: right bottom;
      }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="stage" id="stage">
      <!-- Brand mark -->
      <div class="brand-mark">
        <svg viewBox="0 0 66 62" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="33" y1="1" x2="33" y2="61" stroke="#ffffff" stroke-width="5" stroke-linecap="square" />
          <line x1="3" y1="31" x2="63" y2="31" stroke="#ffffff" stroke-width="5" stroke-linecap="square" />
          <line x1="11.8" y1="9.8" x2="54.2" y2="52.2" stroke="#ffffff" stroke-width="5" stroke-linecap="square" />
          <line x1="54.2" y1="9.8" x2="11.8" y2="52.2" stroke="#ffffff" stroke-width="5" stroke-linecap="square" />
        </svg>
      </div>

      <!-- Primary nav -->
      <ul class="primary-nav">
        <li class="nav-home"><a href="#home">Home</a></li>
        <li class="nav-resources"><a href="#resources">Resources</a></li>
        <li class="nav-benefits"><a href="#benefits">Benefits</a></li>
        <li class="nav-contact"><a href="#contact">Contact</a></li>
      </ul>

      <!-- Secure system pill button linking to studio -->
      <a href="./studio" class="secure-pill" id="secure-pill">
        <span>Launch Studio</span>
      </a>

      <!-- Wordmark ORBIT -->
      <h1 class="orbit-word" id="orbit-title" aria-label="Orbit">
        <span class="orbit-word__mask">
          <span class="orbit-word__inner">
            <span class="orbit-word__white"><span class="orbit-word__o">O</span>R</span>
            <span class="orbit-word__pink">BIT</span>
          </span>
        </span>
      </h1>

      <!-- Flower stack -->
      <div class="flower" id="flower">
        <img class="flower__sizer" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85" alt="" aria-hidden="true">
        <div class="flower__layer flower__layer--bg" id="flower-bg">
          <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85" alt="Pixel-art pink and violet lily">
        </div>
        <div class="flower__layer flower__layer--top" id="flower-top" aria-hidden="true">
          <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&w=1280&q=85" alt="">
        </div>
      </div>

      <!-- Corner copy -->
      <p class="support-copy support-copy--left">
        <span class="support-copy__inner">
          Every workflow,<br>intelligently connected.
        </span>
      </p>

      <p class="support-copy support-copy--right">
        <span class="support-copy__inner">
          Less manual work.<br>More meaningful output.
        </span>
      </p>

      <!-- Mobile menu -->
      <button class="mobile-burger" id="burger-btn" aria-label="Toggle menu">
        <div class="mobile-burger-lines">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>

      <div class="mobile-scrim" id="mobile-scrim"></div>

      <div class="mobile-sheet" id="mobile-sheet">
        <nav class="mobile-nav-links">
          <a href="#home">Home</a>
          <a href="#resources">Resources</a>
          <a href="#benefits">Benefits</a>
          <a href="#contact">Contact</a>
        </nav>
        <a href="./studio" class="mobile-pill">Launch Studio</a>
      </div>
    </section>
  </main>

  <script>
    (function() {
      // 1. Remove .anim class after entrance choreography
      setTimeout(function() {
        document.documentElement.classList.remove('anim');
      }, 5500);

      // 2. Mobile Menu
      var burger = document.getElementById('burger-btn');
      var scrim = document.getElementById('mobile-scrim');
      var sheet = document.getElementById('mobile-sheet');

      function toggleMenu(open) {
        var isOpen = typeof open === 'boolean' ? open : !sheet.classList.contains('open');
        burger.classList.toggle('open', isOpen);
        scrim.classList.toggle('open', isOpen);
        sheet.classList.toggle('open', isOpen);
      }

      if (burger && scrim && sheet) {
        burger.addEventListener('click', function() { toggleMenu(); });
        scrim.addEventListener('click', function() { toggleMenu(false); });
        var links = sheet.querySelectorAll('a');
        for (var i = 0; i < links.length; i++) {
          links[i].addEventListener('click', function() { toggleMenu(false); });
        }
        window.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') toggleMenu(false);
        });
      }

      // 3. Mouse Morph-Reveal Trail Engine
      var stage = document.getElementById('stage');
      var flower = document.getElementById('flower');
      var bgLayer = document.getElementById('flower-bg');
      var topLayer = document.getElementById('flower-top');

      var bgCanvas = document.createElement('canvas');
      var topCanvas = document.createElement('canvas');

      var TRAIL_MAX_POINTS  = 60;
      var TRAIL_HEAD_R      = 140;
      var TRAIL_NOISE_AMP   = 44;
      var TRAIL_BLOB_PTS    = 24;
      var TRAIL_FADE_SPEED  = 0.92;
      var TRAIL_SAMPLE_DIST = 8;

      var hovering = false;
      var headRadius = 0;
      var mouseX = 0;
      var mouseY = 0;
      var lastSample = null;
      var points = [];
      var time = 0;

      stage.addEventListener('mousemove', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        hovering = true;
      });

      stage.addEventListener('mouseenter', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        hovering = true;
      });

      stage.addEventListener('mouseleave', function() {
        hovering = false;
        lastSample = null;
      });

      function drawMorphBlob(ctx, cx, cy, r, t, seed) {
        if (r < 2) return;
        var pts = [];
        var num = TRAIL_BLOB_PTS;
        for (var i = 0; i < num; i++) {
          var angle = (i / num) * Math.PI * 2;
          var n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
          var n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
          var n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
          var noise = (n1 + n2 + n3) * TRAIL_NOISE_AMP * (r / 140);
          var rad = Math.max(0, r + noise);
          pts.push({
            x: cx + Math.cos(angle) * rad,
            y: cy + Math.sin(angle) * rad
          });
        }

        ctx.beginPath();
        ctx.moveTo((pts[0].x + pts[pts.length - 1].x) / 2, (pts[0].y + pts[pts.length - 1].y) / 2);
        for (var j = 0; j < pts.length; j++) {
          var next = pts[(j + 1) % pts.length];
          var midX = (pts[j].x + next.x) / 2;
          var midY = (pts[j].y + next.y) / 2;
          ctx.quadraticCurveTo(pts[j].x, pts[j].y, midX, midY);
        }
        ctx.closePath();
        ctx.fill();
      }

      function loop() {
        if (flower) {
          var rect = flower.getBoundingClientRect();
          var w = Math.max(1, Math.floor(rect.width));
          var h = Math.max(1, Math.floor(rect.height));

          if (bgCanvas.width !== w || bgCanvas.height !== h) {
            bgCanvas.width = w;
            bgCanvas.height = h;
          }
          if (topCanvas.width !== w || topCanvas.height !== h) {
            topCanvas.width = w;
            topCanvas.height = h;
          }

          var targetR = hovering ? TRAIL_HEAD_R : 0;
          headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);

          if (hovering && headRadius > 5) {
            var mx = mouseX - rect.left;
            var my = mouseY - rect.top;

            var push = false;
            if (!lastSample) {
              push = true;
            } else {
              var dx = mx - lastSample.x;
              var dy = my - lastSample.y;
              if (Math.hypot(dx, dy) >= TRAIL_SAMPLE_DIST) {
                push = true;
              }
            }

            if (push) {
              points.push({
                x: mx,
                y: my,
                r: headRadius,
                alpha: 1.0,
                seed: Math.random() * 100
              });
              if (points.length > TRAIL_MAX_POINTS) {
                points.shift();
              }
              lastSample = { x: mx, y: my };
            }
          }

          for (var k = points.length - 1; k >= 0; k--) {
            var p = points[k];
            p.alpha *= TRAIL_FADE_SPEED;
            p.r *= 0.995;
            if (p.alpha < 0.01 || p.r < 2) {
              points.splice(k, 1);
            }
          }

          time += 0.016;

          var bgCtx = bgCanvas.getContext('2d');
          var topCtx = topCanvas.getContext('2d');

          if (bgCtx && topCtx) {
            if (points.length === 0 && headRadius < 2) {
              topLayer.style.maskImage = 'linear-gradient(#0000, #0000)';
              topLayer.style.webkitMaskImage = 'linear-gradient(#0000, #0000)';
              bgLayer.style.maskImage = 'none';
              bgLayer.style.webkitMaskImage = 'none';
            } else {
              // BG Mask
              bgCtx.globalCompositeOperation = 'source-over';
              bgCtx.fillStyle = '#ffffff';
              bgCtx.fillRect(0, 0, w, h);

              bgCtx.globalCompositeOperation = 'destination-out';
              for (var b = 0; b < points.length; b++) {
                var pb = points[b];
                bgCtx.fillStyle = 'rgba(255, 255, 255, ' + pb.alpha + ')';
                drawMorphBlob(bgCtx, pb.x, pb.y, pb.r, time, pb.seed);
              }

              // Top Mask
              topCtx.clearRect(0, 0, w, h);
              topCtx.globalCompositeOperation = 'source-over';
              for (var tIdx = 0; tIdx < points.length; tIdx++) {
                var pt = points[tIdx];
                topCtx.fillStyle = 'rgba(255, 255, 255, ' + pt.alpha + ')';
                drawMorphBlob(topCtx, pt.x, pt.y, pt.r, time, pt.seed);
              }

              var bgUrl = bgCanvas.toDataURL('image/png');
              var topUrl = topCanvas.toDataURL('image/png');

              bgLayer.style.maskImage = 'url(' + bgUrl + ')';
              bgLayer.style.webkitMaskImage = 'url(' + bgUrl + ')';
              topLayer.style.maskImage = 'url(' + topUrl + ')';
              topLayer.style.webkitMaskImage = 'url(' + topUrl + ')';
            }
          }
        }
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
